databases:
  - name: tradexa-db
    plan: free
    databaseName: tradexa
    user: tradexa

services:
  # ---- Backend: FastAPI ----
  - type: web
    name: tradexa-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradexa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://tradexa-frontend.onrender.com
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false

  # ---- Frontend: React + Vite (static site) ----
  - type: web
    name: tradexa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tradexa-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
